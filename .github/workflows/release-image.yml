name: Release OCI Images

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  quality-gate:
    name: Verify Quality Gates Before Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/requirements-dev.txt -r requirements/requirements-cpu.txt

      - name: Run Ruff Checks
        run: |
          ruff check src/ scripts/ tests/
          ruff format --check src/ scripts/ tests/

      - name: Run Geospatial Pytest
        run: python -m pytest -ra -q tests/

  publish-images:
    name: Build & Publish OCI Images to GHCR
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Version Tags
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME}"
          REPO_LC="${GITHUB_REPOSITORY,,}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "repo=${REPO_LC}" >> "$GITHUB_OUTPUT"

      - name: Build and Push CPU Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.cpu
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo }}:${{ steps.meta.outputs.version }}-cpu
            ghcr.io/${{ steps.meta.outputs.repo }}:latest-cpu
          labels: |
            org.opencontainers.image.title=VHR Satellite Segmentation Pipeline (CPU)
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.licenses=MIT

      - name: Build and Push GPU Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.gpu
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo }}:${{ steps.meta.outputs.version }}-gpu
            ghcr.io/${{ steps.meta.outputs.repo }}:latest-gpu
          labels: |
            org.opencontainers.image.title=VHR Satellite Segmentation Pipeline (GPU)
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.licenses=MIT
